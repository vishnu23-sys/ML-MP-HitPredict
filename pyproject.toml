[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitpredict"
version = "1.0.0"
description = "Reproduction and extension of HitPredict: predicting Billboard hits from Spotify audio features"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["hitpredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
